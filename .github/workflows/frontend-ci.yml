name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'campus-seguro-front/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'campus-seguro-front/**'
      - '.github/workflows/frontend-ci.yml'

# Cancela execuções antigas do mesmo branch/PR quando um novo push chega
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: campus-seguro-front

jobs:
  lint-and-typecheck:
    name: Lint + TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: campus-seguro-front/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: ESLint (expo lint)
        run: npm run lint

      - name: Checagem de tipos (tsc)
        run: npx tsc --noEmit
