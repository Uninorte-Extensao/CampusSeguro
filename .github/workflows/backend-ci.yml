name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'campus-seguro-back/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'campus-seguro-back/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: campus-seguro-back

jobs:
  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            campus-seguro-back/requirements.txt
            campus-seguro-back/requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Rodar testes
        env:
          PYTHONPATH: ${{ github.workspace }}/campus-seguro-back
        run: pytest llm_service
