name: Backend Docker Publish

# Builda a imagem do backend e publica no GitHub Container Registry (GHCR).
# Roda automaticamente ao dar push na main (quando o backend muda) e também
# pode ser disparado manualmente pela aba Actions.
on:
  push:
    branches: [main]
    paths:
      - 'campus-seguro-back/**'
      - '.github/workflows/backend-docker.yml'
  workflow_dispatch:

concurrency:
  group: backend-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem (minúsculo)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/campus-seguro-back" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: campus-seguro-back
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
