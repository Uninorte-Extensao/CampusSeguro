server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Anexos (fotos, vídeos, áudios) enviados nas denúncias
    client_max_body_size 50m;

    # API (FastAPI): /api/ocorrencias -> http://api:8000/ocorrencias
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Arquivos do build têm hash no nome: podem ficar em cache por muito tempo
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # App web (SPA do expo-router): qualquer rota cai no index.html.
    # index.html nunca fica em cache, senão o navegador continua abrindo
    # a versão antiga do app depois de um novo deploy.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
